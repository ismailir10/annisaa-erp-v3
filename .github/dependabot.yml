version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    groups:
      # react + react-dom must move together — npm hard-fails ERESOLVE when the
      # two differ (see closed PRs #426/#446, which deadlocked each other).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # TS majors (6/7 native compiler) break Build + Lint until Next toolchain
      # supports them — see closed PR #389. Minors/patches still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react peers cap at eslint ^9.7, so ESLint 10 dies with
      # "contextOrFilename.getFilename is not a function" — see closed PR #460.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: staging
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
